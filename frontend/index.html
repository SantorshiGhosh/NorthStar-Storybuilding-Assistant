<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>NorthStar — AI Continuity Guardian for Novelists &amp; Screenwriters</title>
    <meta name="description" content="NorthStar is a calm, monochromatic AI continuity guardian for authors and screenwriters. Safeguard canon across multi-chapter manuscripts with AES-256 encrypted vaults, living knowledge graphs, and real-time contradiction detection." />
    <meta name="keywords" content="story bible, novel continuity, writing assistant, canon tracking, character consistency, screenplay continuity, world building" />
    <meta name="author" content="NorthStar AI" />
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NorthStar AI" />
    <meta property="og:title" content="NorthStar — AI Continuity Guardian" />
    <meta property="og:description" content="Safeguard your story canon with automated contradiction audits, living knowledge graphs, and persistent lore memory." />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NorthStar — AI Continuity Guardian" />
    <meta name="twitter:description" content="Safeguard your story canon with automated contradiction audits, living knowledge graphs, and persistent lore memory." />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- Mobile Theme Colors -->
    <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('story_bible_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
